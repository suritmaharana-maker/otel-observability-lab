apiVersion: v1
kind: ConfigMap
metadata:
  name: otelcol-config
  namespace: observability
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"
          http:
            endpoint: "0.0.0.0:4318"
            cors:
              allowed_origins:
                - "http://localhost:5173"
              allowed_headers:
                - "*"
    
      hostmetrics:
        collection_interval: 30s
        root_path: /hostfs
        scrapers:
          cpu: {}
          memory: {}
          disk: {}
          network: {}
    
      prometheus/hubble:
        config:
          scrape_configs:
            - job_name: "hubble-metrics"
              scrape_interval: 30s
              static_configs:
                - targets: ["hubble-metrics.kube-system.svc.cluster.local:9965"]
              metric_relabel_configs:
                - source_labels: [__name__]
                  regex: "hubble_.*"
                  action: keep

      # Cilium's own policy-change audit trail (root-cause change events, not
      # symptom metrics). Reads container log files via the existing hostfs
      # mount - no new volume needed. CRI-format log lines are unwrapped by
      # the container operator (which also recovers the REAL event
      # timestamp), then filtered to only the policy-change lines - Cilium
      # is otherwise very chatty and we don't want to ingest all of it.
      #
      # IMPORTANT: stanza's filter operator DROPS entries that MATCH the
      # expression (confirmed against the official docs) - the opposite of
      # what the expression below looks like it does at a glance. To KEEP
      # only policy-change lines, we must match (and drop) everything that
      # is NOT a policy-change line. Found and fixed after the original
      # (non-negated) expression was silently doing the reverse of what was
      # intended for this pipeline's entire lifetime - verified via a real
      # query showing unrelated cilium-agent chatter (e.g. "Reloaded
      # endpoint BPF program") tagged as cilium-policy-events, with zero
      # actual "Imported/Deleted CiliumNetworkPolicy" lines present.
      filelog/cilium:
        include:
          - /hostfs/var/log/pods/kube-system_cilium-*/cilium-agent/*.log
        include_file_path: true
        start_at: end
        operators:
          - type: container
            id: container-parser
          - type: filter
            id: policy-events-only
            expr: 'not (body matches "CiliumNetworkPolicy")'
    
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 512
        spike_limit_mib: 128
      batch:
        send_batch_size: 1000
        timeout: 10s
      resource:
        attributes:
          - key: deployment.environment
            value: "lab"
            action: upsert
          - key: cloud.provider
            value: "aws"
            action: upsert
          - key: cloud.region
            value: "us-east-2"
            action: upsert
      resource/cilium_events:
        attributes:
          - key: service.name
            value: "cilium-policy-events"
            action: upsert
          - key: deployment.environment
            value: "lab"
            action: upsert
    
    exporters:
      otlp/dash0:
        endpoint: "ingress.us-west-2.aws.dash0.com:4317"
        auth:
          authenticator: bearertokenauth/dash0
      debug:
        verbosity: basic
    
    extensions:
      bearertokenauth/dash0:
        scheme: Bearer
        token: "${env:DASH0_AUTH_TOKEN}"
    
    service:
      extensions: [bearertokenauth/dash0]
      pipelines:
        metrics:
          receivers: [otlp, hostmetrics, prometheus/hubble]
          processors: [memory_limiter, resource, batch]
          exporters: [otlp/dash0]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [otlp/dash0, debug]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [otlp/dash0, debug]
        logs/cilium_events:
          receivers: [filelog/cilium]
          processors: [memory_limiter, resource/cilium_events, batch]
          exporters: [otlp/dash0, debug]